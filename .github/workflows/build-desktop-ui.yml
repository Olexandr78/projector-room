name: Build desktop web interface

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".gitignore"
      - ".github/workflows/build-desktop-ui.yml"
  workflow_dispatch:

concurrency:
  group: build-desktop-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for desktop bridge tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal Python test dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check Python syntax
        run: python -m py_compile main.py
      - name: Simulate native WebView lifecycle and UI-thread behavior
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js for CI build only
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: TypeScript type check
        run: npm run lint
      - name: Build static website
        run: npm run build
      - name: Commit prebuilt interface
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build precompiled desktop web interface"
          file_pattern: "dist/**"
