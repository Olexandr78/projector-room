name: Build desktop web interface

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build-desktop-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js for CI build only
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build static website
        run: npm run build
      - name: Commit prebuilt interface
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build precompiled desktop web interface"
          file_pattern: "dist/**"
