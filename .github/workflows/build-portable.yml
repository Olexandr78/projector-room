name: Build portable Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "src/**"
      - "dist/**"
      - "requirements.txt"
      - "tests/**"
      - "build_portable.py"
      - "build_portable.bat"
      - "README_PORTABLE.txt"
      - ".github/workflows/build-portable.yml"
  workflow_dispatch:

concurrency:
  group: build-portable-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python requirements and PyInstaller
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Check Python syntax and simulated WebView lifecycle
        run: |
          python -m py_compile main.py build_portable.py
          python -m unittest discover -s tests -v

      - name: Build React interface
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run lint
          npm run build

      - name: Build one-file portable executable with PyInstaller
        run: python build_portable.py

      - name: Smoke-test the bundled executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\portable\ProjectorRoom.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--portable-smoke-test" -PassThru -Wait
          Write-Host "Portable EXE exit code: $($process.ExitCode)"
          $log = ".\portable\projector_room.log"
          if (Test-Path $log) {
            Write-Host "===== Projector Room smoke-test log ====="
            Get-Content $log -Tail 120
          } else {
            Write-Host "No portable smoke-test log was created."
          }
          if ($process.ExitCode -ne 0) {
            throw "Portable EXE smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ProjectorRoom-Portable-Windows-x64
          path: ProjectorRoom-Portable-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
